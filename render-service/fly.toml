app = "scadbot"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RENDER_TIMEOUT = "120"

# RENDER_TOKEN is set via: fly secrets set RENDER_TOKEN=<hex>
# Never put secrets in this file.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 2

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

kill_timeout = "130s"
